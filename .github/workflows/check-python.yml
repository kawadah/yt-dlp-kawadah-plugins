name: Check Python

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/pyproject.toml"
      - .github/workflows/check-python.yml

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: python uv
      - name: Check format
        run: mise run format:python
      - name: Lint
        run: mise run lint:python
