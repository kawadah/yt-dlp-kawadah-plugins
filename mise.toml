[settings]
install_before = "3d"
lockfile = true
pin = true

[tools]
python = "3.14.4"
uv = "0.11.7"

[tasks.dev]
env = { PYTHONPATH = "{{config_root}}" }
run = "uv run yt-dlp"

[tasks.format]
description = "Check formatting"
depends = ["format:python"]

[tasks."format:python"]
description = "Check Python formatting"
run = "uv run ruff format --check ."

[tasks."format:python:fix"]
description = "Format Python code"
run = "uv run ruff format ."

[tasks.lint]
description = "Lint"
depends = ["lint:python"]

[tasks."lint:python"]
description = "Lint Python code"
run = "uv run ruff check ."

[tasks."lint:python:fix"]
description = "Fix Python lint errors"
run = "uv run ruff check --fix ."
